<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인도네시아어 Theo 회화 사전</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8f7f4;--surface:#fff;--surface2:#f2f1ee;
  --border:#e4e2dd;--border2:#d0cec9;
  --text:#1a1917;--text2:#5a5854;--text3:#8a8784;
  --accent:#1a6b3c;--accent-bg:#e8f5ee;--accent-text:#0d4527;
  --pron-bg:#fff8ee;--pron:#7a4a00;
  --mix-bg:#fef8ec;--mix-text:#7a4f00;
  --ko-bg:#eef6e8;--ko-text:#2d5a1b;
  --id-bg:#e8f0fb;--id-text:#1a3a7a;
  --r:10px;--rs:6px;
}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.6}

header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;position:sticky;top:0;z-index:200;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.hi{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:12px 0}
.logo{font-size:17px;font-weight:600;color:var(--text);white-space:nowrap;display:flex;align-items:center;gap:8px}
.logo-flag{font-size:22px}
.sw{flex:1;position:relative;max-width:340px}
.sw svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
#search{width:100%;height:36px;padding:0 11px 0 34px;border:1px solid var(--border2);border-radius:var(--rs);font-family:inherit;font-size:13px;background:var(--surface2);color:var(--text);outline:none;transition:border-color .15s,background .15s}
#search:focus{border-color:var(--accent);background:#fff}

.cat-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px}
.cat-inner{max-width:980px;margin:0 auto;padding:10px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cat-search-wrap{position:relative;flex:0 0 210px}
.cat-search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
#cat-search{width:100%;height:32px;padding:0 10px 0 30px;border:1px solid var(--border2);border-radius:var(--rs);font-family:inherit;font-size:12px;background:var(--surface2);color:var(--text);outline:none;transition:border-color .15s}
#cat-search:focus{border-color:var(--accent);background:#fff}
#cat-drop{position:absolute;top:36px;left:0;right:0;background:var(--surface);border:1px solid var(--border2);border-radius:var(--rs);z-index:300;box-shadow:0 4px 12px rgba(0,0,0,.1);display:none;max-height:260px;overflow-y:auto}
.cd-item{padding:8px 12px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:8px;transition:background .1s}
.cd-item:hover,.cd-item.sel{background:var(--accent-bg);color:var(--accent-text)}
.cd-cnt{font-size:11px;color:var(--text3);margin-left:auto;font-family:'IBM Plex Mono',monospace}
.cat-chips{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.chip{height:28px;padding:0 11px;font-family:inherit;font-size:11.5px;font-weight:500;border:1px solid var(--border2);border-radius:20px;background:var(--surface);color:var(--text2);cursor:pointer;transition:all .15s;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.chip:hover{background:var(--surface2)}
.chip.active{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-text);font-weight:600}
.chip-count{font-size:10px;opacity:.7;font-family:'IBM Plex Mono',monospace}

main{max-width:980px;margin:0 auto;padding:20px 24px}
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.fg{display:flex;gap:4px;flex-wrap:wrap}
.fb{height:28px;padding:0 11px;font-family:inherit;font-size:12px;font-weight:500;border:1px solid var(--border2);border-radius:20px;background:var(--surface);color:var(--text2);cursor:pointer;transition:all .15s;white-space:nowrap}
.fb:hover{background:var(--surface2)}
.fb.active{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-text);font-weight:600}
.cbs{display:flex;gap:5px;margin-left:auto}
.cb{height:28px;padding:0 11px;font-family:inherit;font-size:12px;border:1px solid var(--border2);border-radius:var(--rs);background:var(--surface);color:var(--text2);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:4px;white-space:nowrap}
.cb:hover{background:var(--surface2)}
.cb svg{width:13px;height:13px}

.stats{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--text3);margin-bottom:18px;padding:9px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);align-items:center}
.sv{font-weight:600;color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:13px}
.sv-link{font-weight:600;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--accent-text);cursor:pointer;border-bottom:1px dashed var(--accent);text-decoration:none}
.sv-link:hover{opacity:.75}
.atag{display:inline-flex;align-items:center;gap:5px;background:var(--accent-bg);color:var(--accent-text);font-size:11px;font-weight:600;padding:2px 8px 2px 10px;border-radius:20px}
.atag button{background:none;border:none;cursor:pointer;color:var(--accent-text);font-size:14px;line-height:1;padding:0;margin-left:1px;opacity:.6}
.atag button:hover{opacity:1}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:400;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal-overlay.hidden{display:none}
.modal{background:var(--surface);border-radius:var(--r);width:100%;max-width:920px;box-shadow:0 8px 32px rgba(0,0,0,.18);overflow:hidden}
.modal-head{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--border);background:var(--surface)}
.modal-title{font-size:15px;font-weight:600;flex:1}
.modal-sub{font-size:12px;color:var(--text3);margin-left:8px}
.modal-close{width:30px;height:30px;border:none;background:var(--surface2);border-radius:6px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--text2);flex-shrink:0}
.modal-close:hover{background:var(--border2)}
.modal-toolbar{display:flex;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.msw{position:relative;flex:1;min-width:160px}
.msw svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
#modal-search{width:100%;height:34px;padding:0 10px 0 32px;border:1px solid var(--border2);border-radius:var(--rs);font-family:inherit;font-size:13px;background:var(--surface2);color:var(--text);outline:none}
#modal-search:focus{border-color:var(--accent);background:#fff}
.mfbs{display:flex;gap:4px;flex-wrap:wrap}
.mfb{height:28px;padding:0 10px;font-family:inherit;font-size:11.5px;font-weight:500;border:1px solid var(--border2);border-radius:20px;background:var(--surface);color:var(--text2);cursor:pointer;white-space:nowrap;transition:all .15s}
.mfb:hover{background:var(--surface2)}
.mfb.active{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-text);font-weight:600}
.msort{height:28px;padding:0 8px;font-family:inherit;font-size:12px;border:1px solid var(--border2);border-radius:var(--rs);background:var(--surface);color:var(--text2);cursor:pointer;outline:none}
.modal-body{overflow-y:auto;max-height:58vh}
.mtable{width:100%;border-collapse:collapse;table-layout:fixed}
.mtable thead th{padding:7px 10px;font-size:11px;font-weight:600;color:var(--text3);text-align:left;background:var(--surface2);border-bottom:1px solid var(--border);letter-spacing:.05em;text-transform:uppercase;position:sticky;top:0}
.mtable tbody tr{border-bottom:1px solid var(--border);transition:background .1s;cursor:pointer}
.mtable tbody tr:last-child{border-bottom:none}
.mtable tbody tr:hover{background:var(--surface2)}
.mtable td{padding:7px 10px;font-size:12.5px;vertical-align:top;word-break:break-word}
.td-id{font-family:'IBM Plex Mono',monospace;font-weight:500;color:#1a3560;font-size:12px}
.td-pr{color:var(--pron);font-size:12px;background:var(--pron-bg)}
.td-cat{font-size:11px;color:var(--text3);word-break:break-word}
.lp{font-size:10px;font-weight:700;padding:2px 6px;border-radius:20px;white-space:nowrap}
.lid{background:var(--id-bg);color:var(--id-text)}
.lmix{background:var(--mix-bg);color:var(--mix-text)}
.lko{background:var(--ko-bg);color:var(--ko-text)}
.modal-empty{padding:32px;text-align:center;color:var(--text3);font-size:13px}
.modal-foot{font-size:12px;color:var(--text3);padding:8px 16px;border-top:1px solid var(--border);text-align:right}

.gc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:8px;transition:box-shadow .15s}
.ir.highlighted{background:#fffbe6;border-left:3px solid #f0a500;animation:hlFade 2.5s ease forwards}
@keyframes hlFade{0%{background:#fff3b0;border-left-color:#f0a500}80%{background:#fffbe6;border-left-color:#f0a500}100%{background:transparent;border-left-color:transparent}}
.gc:hover{box-shadow:0 2px 8px rgba(0,0,0,.06)}
.gh{display:flex;align-items:center;gap:10px;padding:11px 16px;cursor:pointer;user-select:none;transition:background .12s}
.gh:hover{background:var(--surface2)}
.ge{font-size:18px;flex-shrink:0;width:26px;text-align:center}
.gt{font-size:14px;font-weight:600;color:var(--text);flex:1}
.gbg{font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;background:var(--accent-bg);color:var(--accent-text);flex-shrink:0;font-family:'IBM Plex Mono',monospace}
.chev{width:16px;height:16px;color:var(--text3);transition:transform .2s;flex-shrink:0}
.chev.open{transform:rotate(180deg)}
.gbody{display:none}
.gbody.open{display:block}
.ch{display:grid;grid-template-columns:1fr 0.6fr 0.9fr 68px;background:var(--surface2);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.ch span{padding:6px 12px;font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.05em;text-transform:uppercase}
.sl{padding:5px 14px;font-size:11px;font-weight:600;color:var(--text3);background:var(--surface2);border-bottom:1px solid var(--border)}
.ir{display:grid;grid-template-columns:1fr 0.6fr 0.9fr 68px;border-bottom:1px solid var(--border);transition:background .1s}
.ir:last-child{border-bottom:none}
.ir:hover .cell{background:#fafaf8}
.cell{padding:8px 12px;font-size:13px;color:var(--text);line-height:1.5}
.cell.id{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;color:#1a3560;word-break:break-word}
.cell.pr{font-size:12px;color:var(--pron);background:var(--pron-bg);font-weight:500}
.cell.mn{color:var(--text2);font-size:12.5px}
.cell.lc{display:flex;align-items:center;padding:8px 10px}
mark{background:#ffe58a;border-radius:2px;padding:0 1px}
.empty{padding:48px 24px;text-align:center;color:var(--text3);font-size:14px}
footer{text-align:center;padding:24px;font-size:12px;color:var(--text3);border-top:1px solid var(--border);margin-top:32px}

@media(max-width:640px){
  header{padding:0 12px}.hi{gap:10px;padding:10px 0}.logo span:last-child{display:none}
  .cat-bar{padding:0 12px}.cat-chips{display:none}
  main{padding:16px 12px}
  .ch{grid-template-columns:1fr 1fr}.ch span:nth-child(2),.ch span:last-child{display:none}
  .ir{grid-template-columns:1fr 1fr}.cell.pr,.cell.lc{display:none}
  .cbs{display:none}
  .modal-overlay{padding:0;align-items:stretch}
  .modal{border-radius:0;min-height:100vh;display:flex;flex-direction:column}
  .modal-body{max-height:none;flex:1}
}

/* ── 종료 확인 다이얼로그 ── */
.exit-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:600;display:flex;align-items:center;justify-content:center;padding:16px}
.exit-overlay.hidden{display:none}
.exit-dialog{background:var(--surface);border-radius:var(--r);width:100%;max-width:320px;box-shadow:0 8px 32px rgba(0,0,0,.22);overflow:hidden;animation:fadeUp .18s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.exit-head{padding:20px 20px 8px;text-align:center}
.exit-icon{font-size:32px;margin-bottom:8px}
.exit-title{font-size:16px;font-weight:600;color:var(--text)}
.exit-body{padding:8px 20px 20px;text-align:center;font-size:13px;color:var(--text2);line-height:1.6}
.exit-btns{display:flex;border-top:1px solid var(--border)}
.exit-btn{flex:1;height:48px;border:none;background:none;font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;transition:background .15s}
.exit-btn:first-child{border-right:1px solid var(--border);color:var(--text2)}
.exit-btn:first-child:hover{background:var(--surface2)}
.exit-btn.danger{color:#c0392b;font-weight:600}
.exit-btn.danger:hover{background:#fef0f0}

/* ── 스크롤 TOP 버튼 ── */
#scroll-top{
  position:fixed;right:20px;bottom:24px;
  width:46px;height:46px;
  background:var(--accent);color:#fff;
  border:none;border-radius:50%;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(0,0,0,.22);
  opacity:0;transform:translateY(12px);
  transition:opacity .25s,transform .25s;
  z-index:150;
  pointer-events:none;
}
#scroll-top.visible{opacity:1;transform:translateY(0);pointer-events:auto}
#scroll-top:hover{background:#155c32;box-shadow:0 6px 18px rgba(0,0,0,.28)}
#scroll-top:active{transform:scale(.93)}
#scroll-top svg{width:20px;height:20px}
@media(max-width:640px){
  #scroll-top{right:14px;bottom:18px;width:42px;height:42px}
}

/* ── 비밀번호 화면 ── */
#pw-overlay{
  position:fixed;inset:0;
  background:linear-gradient(135deg,#1a4a2e 0%,#0d2818 100%);
  z-index:9999;
  display:flex;align-items:center;justify-content:center;
  padding:20px;
}
#pw-overlay.hidden{display:none}
.pw-box{
  background:#fff;
  border-radius:16px;
  padding:40px 36px;
  width:100%;max-width:360px;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}
.pw-flag{font-size:48px;margin-bottom:12px}
.pw-title{font-size:20px;font-weight:700;color:#1a1917;margin-bottom:4px}
.pw-sub{font-size:13px;color:#8a8784;margin-bottom:28px}
.pw-input-wrap{position:relative;margin-bottom:14px}
#pw-input{
  width:100%;height:48px;
  border:2px solid #e4e2dd;
  border-radius:10px;
  font-size:22px;letter-spacing:6px;
  text-align:center;
  font-family:'IBM Plex Mono',monospace;
  color:#1a1917;
  outline:none;
  transition:border-color .2s;
  padding:0 44px 0 12px;
}
#pw-input:focus{border-color:#1a6b3c}
#pw-toggle{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;
  color:#8a8784;padding:0;font-size:16px;
}
#pw-toggle:hover{color:#1a1917}
#pw-btn{
  width:100%;height:48px;
  background:#1a6b3c;color:#fff;
  border:none;border-radius:10px;
  font-family:inherit;font-size:15px;font-weight:600;
  cursor:pointer;
  transition:background .15s,transform .1s;
  margin-bottom:12px;
}
#pw-btn:hover{background:#155c32}
#pw-btn:active{transform:scale(.97)}
#pw-error{
  font-size:13px;color:#c0392b;
  height:18px;margin-bottom:4px;
  transition:opacity .2s;
}
.pw-hint{font-size:11px;color:#c8c5c0;margin-top:8px}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.shake{animation:shake .4s ease}
</style>
</head>
<body>

<!-- 비밀번호 화면 -->
<div id="pw-overlay">
  <div class="pw-box">
    <div class="pw-flag">🇮🇩</div>
    <div class="pw-title">인도네시아어 Theo 회화 사전</div>
    <div class="pw-sub">비밀번호를 입력해 주세요</div>
    <div class="pw-input-wrap">
      <input type="password" id="pw-input" placeholder="••••" maxlength="10"
        oninput="clearPwError()" onkeydown="if(event.key==='Enter')checkPw()">
      <button id="pw-toggle" onclick="togglePw()" tabindex="-1" aria-label="비밀번호 표시">
        👁
      </button>
    </div>
    <div id="pw-error"></div>
    <button id="pw-btn" onclick="checkPw()">입력</button>
    <div class="pw-hint">Theo의 개인 학습 자료입니다</div>
  </div>
</div>

<header>
  <div class="hi">
    <div class="logo"><span class="logo-flag">&#127470;&#127465;</span><span>인도네시아어 Theo 회화 사전</span></div>
    <div class="sw">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="search" placeholder="단어&#183;발음&#183;해석 검색..." oninput="render()">
    </div>
  </div>
</header>

<div class="cat-bar">
  <div class="cat-inner">
    <div class="cat-search-wrap">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 6h18M6 12h12M9 18h6"/></svg>
      <input type="text" id="cat-search" placeholder="카테고리 검색..." oninput="onCatSearch()" onfocus="showCatDrop()" onblur="hideCatDrop()">
      <div id="cat-drop"></div>
    </div>
    <div class="cat-chips" id="cat-chips"></div>
  </div>
</div>

<main>
  <div class="tb">
    <div class="fg">
      <button class="fb active" onclick="setLang(this,'all')">전체 언어</button>
      <button class="fb" onclick="setLang(this,'id')">인도네시아어만</button>
      <button class="fb" onclick="setLang(this,'mix')">혼합</button>
    </div>
    <div class="cbs">
      <button class="cb" onclick="toggleAll(true)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg>모두 펼치기</button>
      <button class="cb" onclick="toggleAll(false)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 15l-6-6-6 6"/></svg>모두 접기</button>
    </div>
  </div>
  <div class="stats" id="stats"></div>
  <div id="groups"></div>
</main>
<footer>Theo의 인도네시아어 회화 사전 &#183; 한글 발음 포함 &#183; 318개 표현</footer>

<!-- 스크롤 TOP 버튼 -->
<button id="scroll-top" aria-label="맨 위로 이동" onclick="scrollToTop()">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
    <path d="M18 15l-6-6-6 6"/>
  </svg>
</button>

<!-- 종료 확인 다이얼로그 -->
<div class="exit-overlay hidden" id="exit-overlay">
  <div class="exit-dialog">
    <div class="exit-head">
      <div class="exit-icon">🚪</div>
      <div class="exit-title">종료하시겠습니까?</div>
    </div>
    <div class="exit-body">Theo의 인도네시아어 회화 사전을<br>종료하고 이전 페이지로 이동합니다.</div>
    <div class="exit-btns">
      <button class="exit-btn" onclick="cancelExit()">아니오</button>
      <button class="exit-btn danger" onclick="confirmExit()">예, 종료</button>
    </div>
  </div>
</div>

<!-- 전체 표현 모달 -->
<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal" id="modal">
    <div class="modal-head">
      <div class="modal-title">&#127470;&#127465; 전체 표현 목록</div>
      <span class="modal-sub" id="modal-sub">318개</span>
      <button class="modal-close" id="modal-close-btn">&#10005;</button>
    </div>

const ALL_ITEMS = RAW.flatMap(function(g){ return g.items.map(function(it){ return Object.assign({}, it, {theme: g.theme}); }); });
let lf='all', og=new Set(), activeTheme=null, modalLf='all';

function gp(k){
  if(P[k]) return P[k];
  var lo=k.toLowerCase();
  var keys=Object.keys(P);
  for(var i=0;i<keys.length;i++){ if(keys[i].toLowerCase()===lo) return P[keys[i]]; }
  return '';
}
function glc(l){ return l==='인도네시아어'?'lid':l==='한국어'?'lko':l.indexOf('혼합')>=0?'lmix':'lid'; }
function gll(l){ return l==='인도네시아어'?'ID':l==='한국어'?'KO':l.indexOf('혼합')>=0?'혼합':'기타'; }

function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function hl(t, q){
  if(!q) return escHtml(t);
  var safe = escHtml(t);
  var re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')','gi');
  return safe.replace(re,'<mark>$1</mark>');
}

/* ── 메인 필터 ── */
function fi(items){
  var q=document.getElementById('search').value.toLowerCase();
  return items.filter(function(it){
    var lok = lf==='all' || (lf==='id' && it.lang==='인도네시아어') || (lf==='mix' && it.lang.indexOf('혼합')>=0);
    var pr  = gp(it.indo).toLowerCase();
    var tok = !q || it.indo.toLowerCase().indexOf(q)>=0 || it.meaning.toLowerCase().indexOf(q)>=0 || pr.indexOf(q)>=0;
    return lok && tok;
  });
}
function setLang(btn,val){
  lf=val;
  document.querySelectorAll('.fb').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  render();
}
function toggleAll(open){
  getVisibleGroups().forEach(function(g){ open ? og.add(g.theme) : og.delete(g.theme); });
  render();
}
function toggleGroup(theme){ og.has(theme) ? og.delete(theme) : og.add(theme); render(); }

/* ── 카테고리 칩 ── */
function buildChips(){
  var wrap=document.getElementById('cat-chips');
  var total=ALL_ITEMS.length;
  var html='<button class="chip active" id="chip-all" onclick="selectTheme(null,this)"><span>전체</span><span class="chip-count">'+total+'</span></button>';
  RAW.forEach(function(g){
    var em=g.theme.split(' ')[0];
    var tit=g.theme.slice(em.length).trim();
    var sid=encodeURIComponent(g.theme);
    var th=escHtml(g.theme);
    html+='<button class="chip" data-theme="'+th+'" onclick="selectThemeByEl(this)">'+em+' <span>'+tit+'</span><span class="chip-count">'+g.items.length+'</span></button>';
  });
  wrap.innerHTML=html;
}
function selectThemeByEl(btn){
  var theme=btn.getAttribute('data-theme');
  selectTheme(theme, btn);
}
function selectTheme(theme, btn){
  activeTheme=theme;
  document.querySelectorAll('.chip').forEach(function(c){c.classList.remove('active');});
  if(theme){
    if(btn){ btn.classList.add('active'); }
    else {
      document.querySelectorAll('.chip').forEach(function(c){
        if(c.getAttribute('data-theme')===theme) c.classList.add('active');
      });
    }
    og.clear(); og.add(theme);
  } else {
    document.getElementById('chip-all').classList.add('active');
  }
  render();
  document.getElementById('cat-drop').style.display='none';
  document.getElementById('cat-search').value='';
}

/* ── 카테고리 검색 드롭다운 ── */
function onCatSearch(){
  var q=document.getElementById('cat-search').value.toLowerCase().trim();
  var drop=document.getElementById('cat-drop');
  if(!q){ drop.style.display='none'; return; }
  var matches=RAW.filter(function(g){
    return g.theme.toLowerCase().indexOf(q)>=0 || g.items.some(function(it){ return it.cat.toLowerCase().indexOf(q)>=0; });
  });
  if(!matches.length){
    drop.innerHTML='<div class="cd-item" style="color:var(--text3);cursor:default">결과 없음</div>';
    drop.style.display='block'; return;
  }
  drop.innerHTML=matches.map(function(g){
    var em=g.theme.split(' ')[0];
    var tit=g.theme.slice(em.length).trim();
    var isA=activeTheme===g.theme;
    var th=escHtml(g.theme);
    return '<div class="cd-item'+(isA?' sel':'')+'" data-theme="'+th+'" onmousedown="selectThemeFromDrop(this)">'+em+' '+tit+'<span class="cd-cnt">'+g.items.length+'</span></div>';
  }).join('');
  drop.style.display='block';
}
function selectThemeFromDrop(el){
  selectTheme(el.getAttribute('data-theme'), null);
}
function showCatDrop(){ if(document.getElementById('cat-search').value) onCatSearch(); }
function hideCatDrop(){ setTimeout(function(){ document.getElementById('cat-drop').style.display='none'; }, 160); }

/* ── 보이는 그룹 ── */
function getVisibleGroups(){
  return RAW.filter(function(g){
    if(activeTheme && g.theme!==activeTheme) return false;
    return fi(g.items).length>0;
  });
}

/* ── 메인 렌더 ── */
function render(){
  var q=document.getElementById('search').value;
  var visGroups=getVisibleGroups();
  var tg=0, ti=0, html='';
  visGroups.forEach(function(g){
    var items=fi(g.items);
    if(!items.length) return;
    tg++; ti+=items.length;
    var isOpen=og.has(g.theme)||q.length>0||(activeTheme===g.theme);
    var em=g.theme.split(' ')[0];
    var tit=g.theme.slice(em.length).trim();
    var thEsc=escHtml(g.theme);
    html+='<div class="gc" data-theme="'+thEsc+'">';
    html+='<div class="gh" onclick="toggleGroup(this.parentElement.dataset.theme)">';
    html+='<span class="ge">'+em+'</span><span class="gt">'+tit+'</span><span class="gbg">'+items.length+'</span>';
    html+='<svg class="chev'+(isOpen?' open':'')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg>';
    html+='</div>';
    html+='<div class="gbody'+(isOpen?' open':'')+'">';
    html+='<div class="ch"><span>인도네시아어</span><span>한글 발음</span><span>해석</span><span>언어</span></div>';
    var bc={};
    items.forEach(function(it){ if(!bc[it.cat]) bc[it.cat]=[]; bc[it.cat].push(it); });
    var catKeys=Object.keys(bc);
    catKeys.forEach(function(cat){
      if(catKeys.length>1) html+='<div class="sl">'+escHtml(cat)+'</div>';
      bc[cat].forEach(function(it){
        var pr=gp(it.indo);
        html+='<div class="ir">';
        html+='<div class="cell id">'+hl(it.indo,q)+'</div>';
        html+='<div class="cell pr">'+(pr?hl(pr,q):'—')+'</div>';
        html+='<div class="cell mn">'+hl(it.meaning,q)+'</div>';
        html+='<div class="cell lc"><span class="lp '+glc(it.lang)+'">'+gll(it.lang)+'</span></div>';
        html+='</div>';
      });
    });
    html+='</div></div>';
  });
  if(!html) html='<div class="empty">🔍 검색 결과가 없습니다.</div>';
  document.getElementById('groups').innerHTML=html;

  var total=ALL_ITEMS.length;
  var st='<span>카테고리 <span class="sv">'+tg+'</span>개</span>';
  st+='<span>표현 <span class="sv-link" onclick="openModal()">'+ti+'</span> / <span class="sv-link" onclick="openModal()">'+total+'</span>개</span>';
  if(activeTheme) st+='<span class="atag">'+escHtml(activeTheme)+'<button onclick="selectTheme(null,null)">&#10005;</button></span>';
  st+='<span style="margin-left:auto">'+(lf==='all'?'전체 언어':lf==='mix'?'혼합 항목만':'인도네시아어만')+'</span>';
  document.getElementById('stats').innerHTML=st;
}

/* ── 모달 열기/닫기 ── */
function openModal(){
  document.getElementById('modal-overlay').classList.remove('hidden');
  document.getElementById('modal-search').value='';
  document.getElementById('modal-sort').value='default';
  modalLf='all';
  document.querySelectorAll('.mfb').forEach(function(b,i){ b.classList.toggle('active', i===0); });
  renderModal();
  setTimeout(function(){ document.getElementById('modal-search').focus(); }, 80);
  // Back 버튼으로 모달 닫기용 스택 push
  history.pushState({page:'modal'}, '');
}
function closeModal(){
  var overlay=document.getElementById('modal-overlay');
  if(overlay.classList.contains('hidden')) return;
  overlay.classList.add('hidden');
}

// 바깥 클릭으로 닫기
document.getElementById('modal-overlay').addEventListener('click', function(e){
  if(e.target===this){
    if(history.state&&history.state.page==='modal') history.back();
    else closeModal();
  }
});
// ✕ 버튼
document.getElementById('modal-close-btn').addEventListener('click', function(){
  // history.back() → popstate → closeModal 경로로 통일
  if(history.state && history.state.page==='modal') history.back();
  else closeModal();
});
// ESC 키
document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ if(history.state&&history.state.page==='modal') history.back(); else closeModal(); } });
// ── Back 버튼 / 종료 확인 ──
// 스택 구조: [외부] → [base:dict] → [modal:open]
// 페이지 진입시 기준 스택 push
history.replaceState({page:'base'}, '');

window.addEventListener('popstate', function(e){
  var state = e.state || {};
  // 모달이 열려있을 때 back → 모달 닫기만, 종료팝업 없음
  var overlay = document.getElementById('modal-overlay');
  if(!overlay.classList.contains('hidden')){
    // 모달 닫기 (popstate가 이미 modal 스택 소비함)
    overlay.classList.add('hidden');
    // base 스택 복원 (다음 back은 종료 확인용)
    history.pushState({page:'base'}, '');
    return;
  }
  // 모달 없음 + base 상태 → 종료 확인
  if(state.page === 'base' || !state.page){
    showExitDialog();
  }
});

function showExitDialog(){
  document.getElementById('exit-overlay').classList.remove('hidden');
}
function cancelExit(){
  document.getElementById('exit-overlay').classList.add('hidden');
  history.pushState({page:'base'}, '');
}
function confirmExit(){
  document.getElementById('exit-overlay').classList.add('hidden');
  history.back();
}
document.getElementById('exit-overlay').addEventListener('click', function(e){
  if(e.target === this) cancelExit();
});

function setModalLang(btn,val){
  modalLf=val;
  document.querySelectorAll('.mfb').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  renderModal();
}

function renderModal(){
  var q=document.getElementById('modal-search').value.toLowerCase().trim();
  var sort=document.getElementById('modal-sort').value;
  var items=ALL_ITEMS.filter(function(it){
    var lok=modalLf==='all'||(modalLf==='id'&&it.lang==='인도네시아어')||(modalLf==='mix'&&it.lang.indexOf('혼합')>=0);
    var pr=gp(it.indo).toLowerCase();
    var tok=!q||it.indo.toLowerCase().indexOf(q)>=0||it.meaning.toLowerCase().indexOf(q)>=0||pr.indexOf(q)>=0||it.cat.toLowerCase().indexOf(q)>=0||it.theme.toLowerCase().indexOf(q)>=0;
    return lok&&tok;
  });
  if(sort==='alpha') items.sort(function(a,b){ return a.meaning.localeCompare(b.meaning,'ko'); });
  else if(sort==='cat') items.sort(function(a,b){ return a.cat.localeCompare(b.cat,'ko'); });

  var tbody=document.getElementById('modal-tbody');
  var empty=document.getElementById('modal-empty');
  if(!items.length){
    tbody.innerHTML='';
    empty.style.display='block';
    document.getElementById('modal-foot').textContent='';
    document.getElementById('modal-sub').textContent='검색 결과 없음';
    return;
  }
  empty.style.display='none';
  var rows='';
  items.forEach(function(it){
    var pr=gp(it.indo);
    var thEsc=escHtml(it.theme);
    rows+='<tr data-theme="'+thEsc+'" onclick="goToTheme(this)">';
    rows+='<td class="td-id">'+hl(it.indo,q)+'</td>';
    rows+='<td class="td-pr">'+(pr?hl(pr,q):'—')+'</td>';
    rows+='<td>'+hl(it.meaning,q)+'</td>';
    rows+='<td class="td-cat">'+hl(it.cat,q)+'</td>';
    rows+='<td><span class="lp '+glc(it.lang)+'">'+gll(it.lang)+'</span></td>';
    rows+='</tr>';
  });
  tbody.innerHTML=rows;
  document.getElementById('modal-foot').textContent=items.length+'개 표시 중';
  document.getElementById('modal-sub').textContent=items.length+' / '+ALL_ITEMS.length+'개';
}

function goToTheme(tr){
  var theme=tr.getAttribute('data-theme');
  var cat=tr.querySelector('.td-cat') ? tr.querySelector('.td-cat').textContent.trim() : '';
  var indoText=tr.querySelector('.td-id') ? tr.querySelector('.td-id').textContent.trim() : '';

  // 1) 모달 닫기 (history.back → popstate 경로)
  if(history.state&&history.state.page==='modal'){
    history.back(); // popstate에서 모달 닫힘
  } else {
    document.getElementById('modal-overlay').classList.add('hidden');
  }

  // 2) 카테고리 선택 + 렌더 후 해당 행 찾아 스크롤 + 하이라이트
  selectTheme(theme, null);

  setTimeout(function(){
    // 해당 카테고리 그룹 찾기
    var gcEls = document.querySelectorAll('.gc');
    var targetGc = null;
    gcEls.forEach(function(gc){
      if(gc.getAttribute('data-theme')===theme) targetGc=gc;
    });
    if(!targetGc) return;

    // 그룹 펼치기
    var body=targetGc.querySelector('.gbody');
    if(body && !body.classList.contains('open')) body.classList.add('open');
    var chev=targetGc.querySelector('.chev');
    if(chev) chev.classList.add('open');

    // 행 찾기: indo 텍스트 일치
    var rows=targetGc.querySelectorAll('.ir');
    var targetRow=null;
    rows.forEach(function(row){
      var idCell=row.querySelector('.cell.id');
      if(idCell && idCell.textContent.trim()===indoText) targetRow=row;
    });

    // 스크롤 + 하이라이트
    var scrollTarget = targetRow || targetGc;
    scrollTarget.scrollIntoView({behavior:'smooth', block:'center'});
    if(targetRow){
      // 기존 하이라이트 제거
      document.querySelectorAll('.ir.highlighted').forEach(function(r){ r.classList.remove('highlighted'); });
      targetRow.classList.add('highlighted');
      // 2.5초 후 자동 제거
      setTimeout(function(){ targetRow.classList.remove('highlighted'); }, 2800);
    }
  }, 200);
}

/* ── toggleGroup: data-theme 기반으로 수정 ── */
function toggleGroup(theme){
  og.has(theme) ? og.delete(theme) : og.add(theme);
  render();
}


/* ── 스크롤 TOP 버튼 ── */
function scrollToTop(){
  window.scrollTo({top:0, behavior:'smooth'});
}
(function(){
  var btn=document.getElementById('scroll-top');
  var threshold=300;
  window.addEventListener('scroll', function(){
    if(window.scrollY>threshold){
      btn.classList.add('visible');
    } else {
      btn.classList.remove('visible');
    }
  }, {passive:true});
})();

/* ── 비밀번호 잠금 ── */
(function(){
  var CORRECT = '1405';
  var SESSION_KEY = 'theo_dict_auth';

  function unlock(){
    document.getElementById('pw-overlay').classList.add('hidden');
    document.body.style.overflow = '';
  }

  // 세션 중 이미 인증했으면 바로 통과
  if(sessionStorage.getItem(SESSION_KEY) === '1'){
    unlock();
  } else {
    document.body.style.overflow = 'hidden';
    setTimeout(function(){
      var inp = document.getElementById('pw-input');
      if(inp) inp.focus();
    }, 100);
  }

  window.checkPw = function(){
    var val = document.getElementById('pw-input').value;
    if(val === CORRECT){
      sessionStorage.setItem(SESSION_KEY, '1');
      unlock();
    } else {
      var box = document.querySelector('.pw-box');
      var err = document.getElementById('pw-error');
      err.textContent = '비밀번호가 올바르지 않습니다.';
      document.getElementById('pw-input').value = '';
      box.classList.remove('shake');
      void box.offsetWidth;
      box.classList.add('shake');
    }
  };

  window.clearPwError = function(){
    document.getElementById('pw-error').textContent = '';
  };

  window.togglePw = function(){
    var inp = document.getElementById('pw-input');
    inp.type = inp.type === 'password' ? 'text' : 'password';
  };
})();

buildChips();
render();
</script>
