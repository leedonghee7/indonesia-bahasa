<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인도네시아어 회화 사전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8f7f4;
  --surface:#ffffff;
  --surface2:#f2f1ee;
  --border:#e4e2dd;
  --border2:#d0cec9;
  --text:#1a1917;
  --text2:#5a5854;
  --text3:#8a8784;
  --accent:#1a6b3c;
  --accent-bg:#e8f5ee;
  --accent-text:#0d4527;
  --mix-bg:#fef8ec;
  --mix-text:#7a4f00;
  --ko-bg:#eef6e8;
  --ko-text:#2d5a1b;
  --id-bg:#e8f0fb;
  --id-text:#1a3a7a;
  --radius:10px;
  --radius-sm:6px;
}
html{scroll-behavior:smooth}
body{
  font-family:'Noto Sans KR',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  font-size:14px;
  line-height:1.6;
}

/* Header */
header{
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:0 24px;
  position:sticky;
  top:0;
  z-index:100;
}
.header-inner{
  max-width:900px;
  margin:0 auto;
  display:flex;
  align-items:center;
  gap:16px;
  padding:14px 0;
}
.logo{
  font-size:18px;
  font-weight:600;
  color:var(--text);
  white-space:nowrap;
  display:flex;
  align-items:center;
  gap:8px;
}
.logo-flag{font-size:22px}
.search-wrap{flex:1;position:relative}
.search-wrap svg{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  color:var(--text3);pointer-events:none;
}
#search{
  width:100%;height:38px;
  padding:0 12px 0 38px;
  border:1px solid var(--border2);
  border-radius:var(--radius-sm);
  font-family:inherit;font-size:13px;
  background:var(--surface2);
  color:var(--text);
  outline:none;
  transition:border-color .15s,background .15s;
}
#search:focus{border-color:var(--accent);background:#fff}

/* Main */
main{max-width:900px;margin:0 auto;padding:24px}

/* Toolbar */
.toolbar{
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  margin-bottom:16px;
}
.filter-group{display:flex;gap:4px;flex-wrap:wrap}
.fbtn{
  height:30px;padding:0 12px;
  font-family:inherit;font-size:12px;font-weight:500;
  border:1px solid var(--border2);border-radius:20px;
  background:var(--surface);color:var(--text2);
  cursor:pointer;transition:all .15s;
  white-space:nowrap;
}
.fbtn:hover{background:var(--surface2);border-color:var(--border2)}
.fbtn.active{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-text);font-weight:600}
.ctrl-btns{display:flex;gap:6px;margin-left:auto}
.cbtn{
  height:30px;padding:0 12px;
  font-family:inherit;font-size:12px;
  border:1px solid var(--border2);border-radius:var(--radius-sm);
  background:var(--surface);color:var(--text2);
  cursor:pointer;transition:all .15s;
  display:flex;align-items:center;gap:5px;
  white-space:nowrap;
}
.cbtn:hover{background:var(--surface2)}
.cbtn svg{width:13px;height:13px}

/* Stats bar */
.stats{
  display:flex;gap:16px;flex-wrap:wrap;
  font-size:12px;color:var(--text3);
  margin-bottom:20px;
  padding:10px 14px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
}
.stat-item{display:flex;align-items:center;gap:5px}
.stat-val{font-weight:600;color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:13px}

/* Groups */
.group-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
  margin-bottom:8px;
  transition:box-shadow .15s;
}
.group-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.06)}
.group-header{
  display:flex;align-items:center;gap:10px;
  padding:12px 16px;cursor:pointer;
  user-select:none;
  transition:background .12s;
}
.group-header:hover{background:var(--surface2)}
.g-emoji{font-size:18px;flex-shrink:0;width:26px;text-align:center}
.g-title{font-size:14px;font-weight:600;color:var(--text);flex:1}
.g-badge{
  font-size:11px;font-weight:600;
  padding:2px 9px;border-radius:20px;
  background:var(--accent-bg);color:var(--accent-text);
  flex-shrink:0;
  font-family:'IBM Plex Mono',monospace;
}
.chevron{
  width:16px;height:16px;color:var(--text3);
  transition:transform .2s;flex-shrink:0;
}
.chevron.open{transform:rotate(180deg)}

/* Group body */
.group-body{display:none}
.group-body.open{display:block}
.col-head{
  display:grid;grid-template-columns:1fr 1fr 72px;
  background:var(--surface2);
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
}
.col-head span{
  padding:6px 14px;
  font-size:11px;font-weight:600;
  color:var(--text3);letter-spacing:.05em;text-transform:uppercase;
}
.subcat-label{
  padding:5px 14px;
  font-size:11px;font-weight:600;color:var(--text3);
  background:var(--surface2);
  border-bottom:1px solid var(--border);
  letter-spacing:.03em;
}
.item-row{
  display:grid;grid-template-columns:1fr 1fr 72px;
  border-bottom:1px solid var(--border);
  transition:background .1s;
}
.item-row:last-child{border-bottom:none}
.item-row:hover .cell{background:#fafaf8}
.cell{padding:8px 14px;font-size:13px;color:var(--text);line-height:1.5}
.cell.indo{
  font-family:'IBM Plex Mono',monospace;
  font-size:12.5px;font-weight:500;
  color:#1a3560;
  word-break:break-word;
}
.cell.meaning{color:var(--text2);font-size:12.5px}
.cell.lang-col{display:flex;align-items:center;padding:8px 10px}
.lang-pill{
  font-size:10px;font-weight:700;
  padding:2px 7px;border-radius:20px;
  white-space:nowrap;letter-spacing:.04em;
}
.lang-id{background:var(--id-bg);color:var(--id-text)}
.lang-mix{background:var(--mix-bg);color:var(--mix-text)}
.lang-ko{background:var(--ko-bg);color:var(--ko-text)}
.lang-url{background:#f0e8ff;color:#4a2080}

mark{background:#ffe58a;border-radius:2px;padding:0 1px}

.empty{
  padding:48px 24px;text-align:center;
  color:var(--text3);font-size:14px;
}
.empty svg{width:32px;height:32px;margin-bottom:12px;opacity:.4;display:block;margin-left:auto;margin-right:auto}

/* Footer */
footer{
  text-align:center;padding:24px;
  font-size:12px;color:var(--text3);
  border-top:1px solid var(--border);
  margin-top:32px;
}

@media(max-width:600px){
  header{padding:0 12px}
  main{padding:16px 12px}
  .header-inner{gap:10px;padding:10px 0}
  .logo-text{display:none}
  .col-head{grid-template-columns:1fr 1fr}
  .col-head span:last-child{display:none}
  .item-row{grid-template-columns:1fr 1fr}
  .cell.lang-col{display:none}
  .ctrl-btns{display:none}
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">
      <span class="logo-flag">🇮🇩</span>
      <span class="logo-text">인도네시아어 회화 사전</span>
    </div>
    <div class="search-wrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="search" placeholder="인도네시아어 또는 해석 검색..." oninput="render()">
    </div>
  </div>
</header>

<main>
  <div class="toolbar">
    <div class="filter-group" id="lang-filters">
      <button class="fbtn active" onclick="setLang(this,'all')">전체</button>
      <button class="fbtn" onclick="setLang(this,'id')">인도네시아어만</button>
      <button class="fbtn" onclick="setLang(this,'mix')">혼합</button>
    </div>
    <div class="ctrl-btns">
      <button class="cbtn" onclick="toggleAll(true)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg>
        모두 펼치기
      </button>
      <button class="cbtn" onclick="toggleAll(false)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 15l-6-6-6 6"/></svg>
        모두 접기
      </button>
    </div>
  </div>

  <div class="stats" id="stats"></div>
  <div id="groups"></div>
</main>

<footer>인도네시아 일상 회화 기록 · 총 306개 표현 · 36개 카테고리</footer>

"🚬 물품·소지품","lang":"인도네시아어","indo":"ASBAK","meaning":"재떨이"}]},{"theme":"⏳ 기다림·대기","items":[{"cat":"⏳ 기다림·대기표현","lang":"혼합(인도네시아어+영어)","indo":"tunggu","meaning":"잠깐 기다려주세요"},{"cat":"⏳ 기다림·대기표현","lang":"인도네시아어","indo":"Tunggu sebentar / Tunggu ya","meaning":"잠깐만요"}]},{"theme":"🚫 금지·제한","items":[{"cat":"🚫 금지·제한표현","lang":"혼합(인도네시아어+영어)","indo":"jangan tanya","meaning":"묻지 마세요 (Do not ask)"}]},{"theme":"🏥 건강·몸상태","items":[{"cat":"🏥 건강·몸상태","lang":"인도네시아어","indo":"Sakit","meaning":"아프다"}]},{"theme":"😤 감탄·속어","items":[{"cat":"😤 감탄·속어표현","lang":"인도네시아어","indo":"sial","meaning":"이런! 젠장! (구어체 감탄)"}]},{"theme":"🎨 기타표현","items":[{"cat":"🎭 복장·의상","lang":"인도네시아어","indo":"kostum","meaning":"의상/복장"},{"cat":"📏 수량·거리표현","lang":"인도네시아어","indo":"Berapa meter?","meaning":"몇 미터?"},{"cat":"🌅 인사·시간대표현","lang":"인도네시아어","indo":"Selamat sore","meaning":"좋은 오후 (인사)"},{"cat":"🎨 색상·선택표현","lang":"인도네시아어","indo":"putih atau merah","meaning":"흰색 아니면 빨간색?"},{"cat":"🏔️ 지형·방향표현","lang":"인도네시아어","indo":"pendakian","meaning":"등반/오르막"}]}];

let langFilter='all', openGroups=new Set();

function getLangClass(l){
  if(l==='인도네시아어') return 'lang-id';
  if(l==='한국어') return 'lang-ko';
  if(l.includes('혼합')) return 'lang-mix';
  return 'lang-id';
}
function getLangLabel(l){
  if(l==='인도네시아어') return 'ID';
  if(l==='한국어') return 'KO';
  if(l.includes('혼합')) return '혼합';
  return 'URL';
}
function filterItems(items){
  const q=document.getElementById('search').value.toLowerCase();
  return items.filter(it=>{
    const langOk=langFilter==='all'||(langFilter==='id'&&it.lang==='인도네시아어')||(langFilter==='mix'&&it.lang.includes('혼합'));
    const textOk=!q||it.indo.toLowerCase().includes(q)||it.meaning.toLowerCase().includes(q);
    return langOk&&textOk;
  });
}
function hl(t){
  const q=document.getElementById('search').value;
  if(!q) return t;
  const re=new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi');
  return t.replace(re,'<mark>$1</mark>');
}
function setLang(btn,val){
  langFilter=val;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}
function toggleAll(open){
  RAW.filter(g=>filterItems(g.items).length>0).forEach(g=>{
    open?openGroups.add(g.theme):openGroups.delete(g.theme);
  });
  render();
}
function toggleGroup(theme){
  openGroups.has(theme)?openGroups.delete(theme):openGroups.add(theme);
  render();
}
function render(){
  const q=document.getElementById('search').value;
  let totalG=0,totalI=0,html='';
  RAW.forEach(g=>{
    const items=filterItems(g.items);
    if(!items.length) return;
    totalG++;totalI+=items.length;
    const isOpen=openGroups.has(g.theme)||q.length>0;
    const emoji=g.theme.split(' ')[0];
    const title=g.theme.slice(emoji.length).trim();
    html+=`<div class="group-card">
      <div class="group-header" onclick="toggleGroup('${g.theme.replace(/'/g,"\\'")}')">
        <span class="g-emoji">${emoji}</span>
        <span class="g-title">${title}</span>
        <span class="g-badge">${items.length}</span>
        <svg class="chevron${isOpen?' open':''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <div class="group-body${isOpen?' open':''}">
        <div class="col-head"><span>인도네시아어</span><span>해석 및 맥락</span><span>언어</span></div>`;
    const byCat={};
    items.forEach(it=>{(byCat[it.cat]||(byCat[it.cat]=[])).push(it)});
    Object.entries(byCat).forEach(([cat,ci])=>{
      if(Object.keys(byCat).length>1) html+=`<div class="subcat-label">${cat}</div>`;
      ci.forEach(it=>{
        html+=`<div class="item-row">
          <div class="cell indo">${hl(it.indo)}</div>
          <div class="cell meaning">${hl(it.meaning)}</div>
          <div class="cell lang-col"><span class="lang-pill ${getLangClass(it.lang)}">${getLangLabel(it.lang)}</span></div>
        </div>`;
      });
    });
    html+=`</div></div>`;
  });
  if(!html) html=`<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>검색 결과가 없습니다.</div>`;
  document.getElementById('groups').innerHTML=html;
  document.getElementById('stats').innerHTML=`
    <span class="stat-item"><span class="stat-val">${totalG}</span> 카테고리</span>
    <span class="stat-item"><span class="stat-val">${totalI}</span> 표현</span>
    <span class="stat-item">${langFilter==='all'?'전체 언어':langFilter==='mix'?'혼합 항목만':'인도네시아어만'}</span>
  `;
}
render();
</script>
